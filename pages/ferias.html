<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía de Ferias de Río Cuarto — FeriaZone</title>
  
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fz_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white">

  <div id="navbar-placeholder"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-8">
    
    <div class="border-b border-sand/30 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <span class="text-xs font-bold text-accent uppercase tracking-widest">Encuentros Populares</span>
        <h1 class="text-3xl sm:text-4xl font-black text-ink dark:text-white font-heading mt-1">
          Guía de Ferias de Río Cuarto
        </h1>
        <p class="text-sm text-ink-muted dark:text-slate-300 mt-1">
          Espacios culturales y comerciales al aire libre. Parque Sarmiento, Paseo del Andino, Costanera y más.
        </p>
      </div>

      <a href="./mapa.html" class="btn-primary text-sm py-2.5 px-4 flex items-center gap-2 self-start md:self-auto">
        <span>🗺️</span>
        <span>Ver todas en el Mapa</span>
      </a>
    </div>

    <!-- Filtros de ferias -->
    <div class="flex flex-wrap items-center gap-2">
      <button data-filter="all" class="fair-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-accent text-white shadow-xs">
        Todas (6)
      </button>
      <button data-filter="activa" class="fair-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-sand/30 dark:bg-slate-800 text-ink dark:text-white hover:bg-sand/60">
        En Curso
      </button>
      <button data-filter="proxima" class="fair-filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-sand/30 dark:bg-slate-800 text-ink dark:text-white hover:bg-sand/60">
        Próximas Ediciones
      </button>
    </div>

    <!-- Grilla de ferias -->
    <div id="fairs-list-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Se inyecta dinámicamente -->
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="../js/pages/ferias.js"></script>
</body>
</html>
