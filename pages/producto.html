<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Producto — FeriaZone</title>
  
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fz_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent selection:text-white">

  <div id="navbar-placeholder"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
    
    <!-- Contenedor cargador / detalle -->
    <div id="product-detail-container">
      <p class="text-center text-ink-muted">Cargando información del producto...</p>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="../js/pages/producto.js"></script>
</body>
</html>
